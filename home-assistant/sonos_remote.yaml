blueprint:
  name: AWTRIX NG Sonos Remote
  description: >-
    Commands and retained metadata for the Sonos Remote Berry app. Requires
    Home Assistant MQTT and Sonos integrations; no TC002 AWTRIX Bridge add-on.
    Use one automation and one unique topic root per remote. Configure the same
    entity and root in Berry. On TC002 beta 1.1.6 or later, album artwork can be
    fetched and resized by the clock using a URL, without a converter.
    Commands must be published with retain=false.
  domain: automation
  author: Luca + Codex
  source_url: https://github.com/lucaamo/tc002-sonos-remote/blob/main/home-assistant/sonos_remote.yaml
  homeassistant:
    min_version: '2024.10.0'
  input:
    player:
      name: Sonos player
      selector:
        entity:
          filter:
            - domain: media_player
              integration: sonos
    mqtt_root:
      name: MQTT topic root
      description: Match Berry's root. No trailing slash, + or #. Unique per remote.
      default: tc002/sonos_remote/v2
      selector:
        text:
    clear_artwork:
      name: Use fallback icon instead of album artwork
      description: >-
        Disable to show album artwork. Set the Home Assistant URL below for
        native URL artwork on TC002 beta 1.1.6 or later. With that URL empty,
        existing external GIF/RGB artwork publishers remain compatible.
      default: true
      selector:
        boolean:
    artwork_base_url:
      name: Home Assistant URL for native album artwork
      description: >-
        Local HTTP(S) address reachable from the clock, for example
        http://homeassistant.local:8123. Resolves relative entity_picture URLs.
        Disable the fallback-only option above to enable native artwork.
        Leave empty when using an external publisher. Requires Sonos Remote
        3.3.0 and TC002 beta 1.1.6 or later. Self-signed HTTPS is unsupported.
      default: ''
      selector:
        text:

mode: queued
max: 30
max_exceeded: warning
trace:
  stored_traces: 20
trigger_variables:
  topic_root: !input mqtt_root
triggers:
  - trigger: mqtt
    topic: '{{ topic_root }}/command'
    id: command
  - trigger: state
    entity_id: !input player
    id: state
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: time_pattern
    seconds: /30
    id: heartbeat
variables:
  player: !input player
  topic_root: !input mqtt_root
  clear_artwork: !input clear_artwork
  artwork_base_url: !input artwork_base_url
actions:
  - variables:
      cmd: >-
        {{ trigger.payload | from_json({})
           if trigger is defined and trigger.id == 'command' else {} }}
      is_command: '{{ trigger is defined and trigger.id == "command" }}'
      valid_root: >-
        {{ topic_root is string and 0 < topic_root | length <= 96
           and not topic_root.endswith('/') and '+' not in topic_root
           and '#' not in topic_root and '\n' not in topic_root }}
  # A template is necessary here to validate the external JSON protocol,
  # rather than for a state check that could use a native condition.
  - condition: template
    value_template: '{{ valid_root }}'
  - variables:
      command_action: '{{ cmd.get("action", "") if cmd is mapping else "" }}'
      valid_command: >-
        {% set c = cmd if cmd is mapping else {} %}
        {% set a = c.get('action', '') %}
        {% set v = c.get('value') %}
        {% set content = c.get('media_content_id') %}
        {% set kind = c.get('media_content_type') %}
        {{ c.get('player_entity_id') == player and
           (a in ['refresh', 'play_pause', 'next', 'previous'] or
            (a == 'volume' and v is number and v is not boolean and 0 <= v <= 100) or
            (a == 'delta' and v is number and v is not boolean and -25 <= v <= 25) or
            (a == 'play_media' and content is string and 0 < content | length <= 768
             and kind is string and 0 < kind | length <= 64)) }}
  - condition: template
    value_template: '{{ not is_command or valid_command }}'
  - choose:
      - conditions:
          - condition: template
            value_template: '{{ is_command and command_action != "refresh" }}'
          - condition: not
            conditions:
              - condition: state
                entity_id: !input player
                state:
                  - unavailable
                  - unknown
        sequence:
          - choose:
              - conditions: '{{ command_action == "play_pause" }}'
                sequence:
                  - action: media_player.media_play_pause
                    target:
                      entity_id: !input player
              - conditions: '{{ command_action == "next" }}'
                sequence:
                  - action: media_player.media_next_track
                    target:
                      entity_id: !input player
              - conditions: '{{ command_action == "previous" }}'
                sequence:
                  - action: media_player.media_previous_track
                    target:
                      entity_id: !input player
              - conditions: '{{ command_action in ["volume", "delta"] }}'
                sequence:
                  - variables:
                      current_volume: '{{ state_attr(player, "volume_level") }}'
                      target_volume: >-
                        {{ cmd.value / 100 if command_action == 'volume' else
                           ([0, [1, current_volume + cmd.value / 100] | min] | max
                            if current_volume is number else none) }}
                  - condition: template
                    value_template: '{{ target_volume is number }}'
                  - action: media_player.volume_set
                    target:
                      entity_id: !input player
                    data:
                      volume_level: '{{ target_volume }}'
              - conditions: '{{ command_action == "play_media" }}'
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: !input player
                    data:
                      media_content_id: '{{ cmd.media_content_id }}'
                      media_content_type: '{{ cmd.media_content_type }}'
  # Read state at execution time, not trigger time. A queued old state event
  # must never publish its old volume after a newer command.
  - variables:
      metadata: >-
        {% set vol = state_attr(player, 'volume_level') %}
        {{ {'artist': state_attr(player, 'media_artist') or '',
            'title': state_attr(player, 'media_title') or '',
            'playing': states(player),
            'player_name': state_attr(player, 'friendly_name') or player,
            'volume': ((vol * 100) | round(0) | int | string) if vol is number else '',
            'error': 'Sonos unavailable' if states(player) in ['unknown', 'unavailable'] else '',
            'heartbeat': now().isoformat()} }}
  - repeat:
      for_each: '{{ metadata.items() | list }}'
      sequence:
        - action: mqtt.publish
          data:
            topic: '{{ topic_root }}/state/{{ repeat.item[0] }}'
            payload: '{{ repeat.item[1] }}'
            retain: true
  - choose:
      - conditions: '{{ clear_artwork }}'
        sequence:
          - action: mqtt.publish
            data:
              topic: '{{ topic_root }}/state/cover'
              payload: ''
              retain: true
      - conditions: '{{ artwork_base_url | trim != "" }}'
        sequence:
          - variables:
              cover_url: >-
                {% set picture = state_attr(player, 'entity_picture') or '' %}
                {% set base = artwork_base_url | trim | replace('\n', '') | replace('\r', '') %}
                {% set valid_base = base.startswith(('http://', 'https://')) and ' ' not in base %}
                {% set url = picture if picture.startswith(('http://', 'https://'))
                   else base.rstrip('/') + picture if valid_base and picture.startswith('/') and not picture.startswith('//')
                   else '' %}
                {{ url if 0 < url | length <= 2048 and ' ' not in url and '\n' not in url
                   and '\r' not in url and '\t' not in url
                   and states(player) not in ['unknown', 'unavailable'] else '' }}
          - action: mqtt.publish
            data:
              topic: '{{ topic_root }}/state/cover'
              payload: >-
                {{ {'width':16, 'height':16, 'image':cover_url} | to_json if cover_url else '' }}
              retain: true
